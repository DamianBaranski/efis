<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AV-30 HSI synthetic vision overlay</title>
<style>
  :root {
    --bg: #0c0c0c;
    --magenta: #ff2fd0;
    --green: #39ff6a;
    --ink: #f2f2f2;
    --muted: #c8c8c8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: transparent;
    color: var(--ink);
    font-family: "DejaVu Sans Mono", "Liberation Mono", ui-monospace, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .page {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 2%;
    width: 100%;
    padding: 2%;
    background: linear-gradient(#6eafdc 0%, #d5e6f2 46%, #8d9a5c 46%, #4f6134 100%);
  }
  .instrument {
    flex: 1 1 60%;
    width: 60%;
    max-width: 96vh;
  }
  .instrument svg {
    width: 100%;
    height: auto;
    display: block;
    background: transparent;
    user-select: none;
  }
  .panel {
    flex: 1 1 34%;
    width: 34%;
    padding: 1.2% 1.4%;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
  }
  @media (max-width: 52rem) {
    .instrument, .panel { flex-basis: 100%; width: 100%; max-width: 100%; }
  }
  .panel h1 {
    margin: 0 0 0.6em;
    font-size: 1rem;
    letter-spacing: 0.08em;
    font-weight: 700;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5em;
    align-items: center;
    margin-bottom: 0.9em;
  }
  button {
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    background: #1c1c1c;
    border: 1px solid #4a4a4a;
    border-radius: 6px;
    padding: 0.35em 0.85em;
    cursor: pointer;
  }
  button:hover { border-color: var(--magenta); }
  #sim-mode {
    margin-left: auto;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--green);
  }
  #sim-mode.manual { color: var(--magenta); }
  label.slider {
    display: block;
    margin: 0.55em 0;
    font-size: 0.82rem;
    color: var(--muted);
  }
  label.slider span {
    float: right;
    color: var(--ink);
    font-weight: 700;
  }
  label.slider input {
    display: block;
    width: 100%;
    margin-top: 0.25em;
    accent-color: var(--magenta);
  }
  .hint {
    margin: 0.8em 0 0;
    color: #8d8d8d;
    font-size: 0.75rem;
    line-height: 1.4;
  }
  svg text {
    font-family: "DejaVu Sans Mono", "Liberation Mono", ui-monospace, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .rose-num { fill: #ececec; font-size: 15px; }
  .rose-card { fill: #ffffff; font-size: 22px; font-weight: 800; }
  .lbl {
    fill: #d5d5d5;
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 0.12em;
  }
  .wpt-id { fill: var(--green); font-size: 26px; }
  .dial-plate { fill: rgba(6, 8, 10, 0.46); }
  .bar { stroke: var(--magenta); stroke-width: 4.5; stroke-linecap: butt; }
  .pivot { fill: none; stroke: none; pointer-events: none; }
  .spin, .slide {
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }
  .spin { transition: transform 0.3s linear; }
  .slide { transition: transform 0.3s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .spin, .slide { transition: none; }
  }
</style>
</head>

    </label>
    <label class="slider">Bearing to waypoint <span id="out-brg">016°</span>
      <input id="sl-brg" type="range" min="0" max="360" step="0.1" value="16" aria-label="Bearing to waypoint degrees">
    </label>
    <label class="slider">Groundspeed <span id="out-gs">155 kt</span>
      <input id="sl-gs" type="range" min="0" max="300" step="1" value="155" aria-label="Groundspeed knots">
    </label>
    <label class="slider">Vertical speed <span id="out-vs">0 fpm</span>
      <input id="sl-vs" type="range" min="-1500" max="2000" step="10" value="0" aria-label="Vertical speed feet per minute">
    </label>
    <p class="hint">Moving a slider pauses the simulated flight. Play continues from those values. Reset restores the reference indication.</p>
  </aside>
</div>

<script>
(function () {
  var VB = 600;
  var XTE_PX_PER_NM = 220;
  var XTE_MAX_PX = 112;
  var VDEV_PX_PER_DOT = 90;
  var VDEV_MAX_PX = 90;
  var TICK_MS = 250;
  var VS_MID = 250;
  var VS_AMP = 750;
  var VS_PHASE0 = Math.asin(-VS_MID / VS_AMP);
  var BASE_COURSE = 16 - Math.atan2(-0.5, 19.1) * 180 / Math.PI;

  function photoData() {
    return {
      heading: 3,
      waypointId: "KABQ",
      bearingToWaypoint: 16,
      distanceNm: 19.1,
      groundSpeedKt: 155,
      verticalSpeedFpm: 0,
      xteNm: 0.5,
      vDevDots: 0,
      windOrTrackAngle: 180,
      apprMode: "LPV",
      apprActive: false,
      page: "1:2",
      batteryPct: 100
    };
  }

  function photoSim() {
    return {
      headingDeg: 3,
      targetHeading: 16,
      turnRateDegPerSec: 3,
      groundSpeedKt: 155,
      verticalSpeedFpm: 0,
      distanceNm: 19.1,
      xteNm: 0.5,
      windPhaseDeg: 180
    };
  }

  var instrumentData = photoData();
  var simState = photoSim();
  var gsBase = 155;
  var vsPhase = VS_PHASE0;
  var vdevPhase = 0;
  var simTimer = null;
  var lastTs = null;
  var syncing = false;
  var shown = {
    rose: instrumentData.heading,
    brg: norm360(instrumentData.bearingToWaypoint - instrumentData.heading),
    wind: instrumentData.windOrTrackAngle
  };

  var roseEl = document.getElementById("rose");
  var brgChev = document.getElementById("bearing-chevron");
  var windChev = document.getElementById("wind-chevron");
  var cdiEl = document.getElementById("cdi-lateral");
  var gsBarEl = document.getElementById("gs-bar");
  var wptEl = document.getElementById("wpt-id");
  var distEl = document.getElementById("dist-val");
  var brgText = document.getElementById("brg-val");
  var xteText = document.getElementById("xte-val");
  var wptTitle = document.getElementById("wpt-title");
  var distTitle = document.getElementById("dist-title");
  var brgTitle = document.getElementById("brg-title");
  var xteTitle = document.getElementById("xte-title");
  var hsiDesc = document.getElementById("hsi-desc");
  var playBtn = document.getElementById("btn-play");
  var modeEl = document.getElementById("sim-mode");

  function clamp(v, lo, hi) {
    return Math.min(hi, Math.max(lo, v));
  }

  function norm360(d) {
    var x = d % 360;
    if (x < 0) x += 360;
    return x;
  }

  function wrap180(d) {
    var x = (d + 180) % 360;
    if (x < 0) x += 360;
    return x - 180;
  }

  function formatVs(fpm) {
    var v = Math.round(fpm / 10) * 10;
    if (v === 0) return "0";
    return (v > 0 ? "+" : "") + v;
  }

  function formatDist(nm) {
    return (Math.round(nm * 10) / 10).toFixed(1);
  }

  function formatXte(nm) {
    var v = Math.round(nm * 10) / 10;
    if (v === 0) return "0.0";
    return v.toFixed(1);
  }

  function formatBrg(deg) {
    var d = Math.round(norm360(deg)) % 360;
    var s = String(d);
    while (s.length < 3) s = "0" + s;
    return s;
  }

  function updateInstrument(data) {
    shown.rose = shown.rose + wrap180(data.heading - shown.rose);
    roseEl.style.transform = "rotate(" + (-shown.rose) + "deg)";

    var relBrg = norm360(data.bearingToWaypoint - data.heading);
    shown.brg = shown.brg + wrap180(relBrg - shown.brg);
    brgChev.style.transform = "rotate(" + shown.brg + "deg)";

    var wind = norm360(data.windOrTrackAngle);
    shown.wind = shown.wind + wrap180(wind - shown.wind);
    windChev.style.transform = "rotate(" + shown.wind + "deg)";

    var xOff = clamp(data.xteNm * XTE_PX_PER_NM, -XTE_MAX_PX, XTE_MAX_PX);
    var yOff = clamp(data.vDevDots * VDEV_PX_PER_DOT, -VDEV_MAX_PX, VDEV_MAX_PX);
    cdiEl.style.transform = "translate(" + (xOff / VB * 100) + "%, 0)";
    gsBarEl.style.transform = "translate(0, " + (yOff / VB * 100) + "%)";

    var distText = formatDist(data.distanceNm);
    var brgNum = formatBrg(data.bearingToWaypoint);
    var xteNum = formatXte(data.xteNm);

    wptEl.textContent = data.waypointId;
    distEl.textContent = distText;
    brgText.textContent = brgNum;
    xteText.textContent = xteNum;

    wptTitle.textContent = "Waypoint " + data.waypointId;
    distTitle.textContent = "Distance " + distText + " nautical miles";
    brgTitle.textContent = "Bearing " + brgNum + " degrees";
    xteTitle.textContent = "Cross track error " + xteNum + " nautical miles";
    hsiDesc.textContent = "Heading " + Math.round(norm360(data.heading)) +
      " degrees, waypoint " + data.waypointId +
      ", bearing " + brgNum +
      ", distance " + distText + " nautical miles.";
  }

  function simTick() {
    var now = performance.now();
    var dt = lastTs == null ? TICK_MS / 1000 : Math.min(0.5, (now - lastTs) / 1000);
    lastTs = now;

    var err = wrap180(simState.targetHeading - simState.headingDeg);
    var step = simState.turnRateDegPerSec * dt;
    if (Math.abs(err) <= step) simState.headingDeg = norm360(simState.targetHeading);
    else simState.headingDeg = norm360(simState.headingDeg + Math.sign(err) * step);

    simState.distanceNm -= (simState.groundSpeedKt / 3600) * dt;
    if (simState.distanceNm < 0.3) simState.distanceNm = 20;

    simState.xteNm += (Math.random() - 0.5) * 0.05;
    simState.xteNm += (0 - simState.xteNm) * 0.04;
    simState.xteNm = clamp(simState.xteNm, -2, 2);

    var correction = Math.atan2(-simState.xteNm, Math.max(simState.distanceNm, 0.25)) * 180 / Math.PI;
    var bearing = norm360(BASE_COURSE + correction);
    simState.targetHeading = bearing;

    simState.windPhaseDeg = norm360(simState.windPhaseDeg + 22 * dt);
    var wind = norm360(180 + 30 * Math.sin(simState.windPhaseDeg * Math.PI / 180));

    vsPhase += dt * (2 * Math.PI / 50);
    var vs = Math.round((VS_MID + VS_AMP * Math.sin(vsPhase)) / 10) * 10;

    vdevPhase += dt * (2 * Math.PI / 34);
    var vdev = Math.sin(vdevPhase) * 0.8;

    var gs = gsBase + (Math.random() - 0.5) * 4;

    instrumentData.heading = simState.headingDeg;
    instrumentData.bearingToWaypoint = bearing;
    instrumentData.distanceNm = simState.distanceNm;
    instrumentData.groundSpeedKt = gs;
    instrumentData.verticalSpeedFpm = vs;
    instrumentData.xteNm = simState.xteNm;
    instrumentData.vDevDots = vdev;
    instrumentData.windOrTrackAngle = wind;
    instrumentData.apprActive = simState.distanceNm < 10;
    instrumentData.waypointId = "KABQ";
    instrumentData.apprMode = "LPV";
    instrumentData.page = "1:2";
    instrumentData.batteryPct = 100;

    updateInstrument(instrumentData);
    syncSliders();
  }

  function startSim() {
    if (simTimer) return;
    lastTs = null;
    simTimer = setInterval(simTick, TICK_MS);
    playBtn.textContent = "Pause";
    modeEl.textContent = "SIM";
    modeEl.classList.remove("manual");
  }

  function stopSim() {
    if (simTimer) {
      clearInterval(simTimer);
      simTimer = null;
    }
    lastTs = null;
    playBtn.textContent = "Play";
    modeEl.textContent = "MANUAL";
    modeEl.classList.add("manual");
  }

  function syncSliders() {
    syncing = true;
    setNum("sl-heading", norm360(instrumentData.heading));
    setNum("sl-xte", instrumentData.xteNm);
    setNum("sl-dist", instrumentData.distanceNm);
    setNum("sl-brg", norm360(instrumentData.bearingToWaypoint));
    setNum("sl-gs", Math.round(instrumentData.groundSpeedKt));
    setNum("sl-vs", Math.round(instrumentData.verticalSpeedFpm));
    paintSliderLabels();
    syncing = false;
  }

  function setNum(id, value) {
    var el = document.getElementById(id);
    var min = parseFloat(el.min);
    var max = parseFloat(el.max);
    el.value = String(clamp(value, min, max));
  }

  function paintSliderLabels() {
    document.getElementById("out-heading").textContent = norm360(parseFloat(document.getElementById("sl-heading").value)).toFixed(1) + "°";
    document.getElementById("out-xte").textContent = parseFloat(document.getElementById("sl-xte").value).toFixed(2) + " nm";
    document.getElementById("out-dist").textContent = parseFloat(document.getElementById("sl-dist").value).toFixed(1) + " nm";
    document.getElementById("out-brg").textContent = formatBrg(parseFloat(document.getElementById("sl-brg").value)) + "°";
    document.getElementById("out-gs").textContent = Math.round(parseFloat(document.getElementById("sl-gs").value)) + " kt";
    document.getElementById("out-vs").textContent = formatVs(parseFloat(document.getElementById("sl-vs").value)) + " fpm";
  }

  function onManual() {
    if (syncing) return;
    stopSim();
    instrumentData.heading = parseFloat(document.getElementById("sl-heading").value);
    instrumentData.xteNm = parseFloat(document.getElementById("sl-xte").value);
    instrumentData.distanceNm = parseFloat(document.getElementById("sl-dist").value);
    instrumentData.bearingToWaypoint = parseFloat(document.getElementById("sl-brg").value);
    instrumentData.groundSpeedKt = parseFloat(document.getElementById("sl-gs").value);
    instrumentData.verticalSpeedFpm = parseFloat(document.getElementById("sl-vs").value);
    instrumentData.apprActive = instrumentData.distanceNm < 10;

    simState.headingDeg = instrumentData.heading;
    simState.distanceNm = instrumentData.distanceNm;
    simState.xteNm = instrumentData.xteNm;
    simState.targetHeading = instrumentData.bearingToWaypoint;
    simState.groundSpeedKt = instrumentData.groundSpeedKt;
    simState.verticalSpeedFpm = instrumentData.verticalSpeedFpm;
    gsBase = instrumentData.groundSpeedKt;

    updateInstrument(instrumentData);
    paintSliderLabels();
  }

  function resetInstrument() {
    var fresh = photoData();
    var keys = Object.keys(fresh);
    for (var i = 0; i < keys.length; i++) instrumentData[keys[i]] = fresh[keys[i]];
    var sim = photoSim();
    keys = Object.keys(sim);
    for (i = 0; i < keys.length; i++) simState[keys[i]] = sim[keys[i]];
    gsBase = 155;
    vsPhase = VS_PHASE0;
    vdevPhase = 0;
    updateInstrument(instrumentData);
    syncSliders();
  }

  playBtn.addEventListener("click", function () {
    if (simTimer) stopSim();
    else startSim();
  });
  document.getElementById("btn-reset").addEventListener("click", resetInstrument);
  var inputs = document.querySelectorAll(".panel input");
  for (var i = 0; i < inputs.length; i++) inputs[i].addEventListener("input", onManual);

  window.instrumentData = instrumentData;
  window.updateInstrument = updateInstrument;

  updateInstrument(instrumentData);
  syncSliders();
  startSim();
})();
</script>
</body>
</html>
